spring.application.name=quan-ly-tra-sua
server.port=8080

# ====== KẾT NỐI POSTGRESQL (tạo database trasua_db trong pgAdmin trước) ======
spring.datasource.url=jdbc:postgresql://localhost:5432/trasua_db
spring.datasource.username=postgres
spring.datasource.password=123456
# ^ Mật khẩu mặc định. Mật khẩu thật của máy bạn đặt trong file cau_hinh_rieng.properties
#   ở thư mục gốc dự án (copy từ cau_hinh_rieng.properties.example) - file đó không lên GitHub.
spring.datasource.driver-class-name=org.postgresql.Driver

# update: Hibernate tự tạo / cập nhật bảng theo các lớp @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ====== THYMELEAF ======
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Hiện thông báo lỗi trên trang error.html
server.error.include-message=always

# Thông tin thanh toán cho BankTransferPaymentStrategy / MomoPaymentStrategy
app.bank.name=Vietcombank
app.bank.account-number=1035407425
app.bank.account-name=MAI VAN QUANG
app.bank.qr-image=/images/payment/vietcombank-qr.png
app.momo.account-name=MAI VAN QUANG
app.momo.qr-image=/images/payment/momo-qr.png

# ====== UPLOAD ẢNH MÓN (thư mục tính từ nơi chạy ứng dụng) ======
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ====== ĐĂNG NHẬP BẰNG GOOGLE ======
# Tạo OAuth Client ID (loại "Web application") tại https://console.cloud.google.com/apis/credentials
# Authorized redirect URI:  http://localhost:8080/login/oauth2/code/google
# Để trống = tắt đăng nhập Google (web vẫn chạy bình thường).
# Điền Client ID / secret trong cau_hinh_rieng.properties (KHÔNG điền ở đây vì file này lên GitHub).
app.google.client-id=
app.google.client-secret=

# Tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ====== CẤU HÌNH RIÊNG TỪNG MÁY (mật khẩu DB, Google secret) ======
# File cau_hinh_rieng.properties ở thư mục gốc dự án (nếu có) sẽ ghi đè các giá trị ở trên.
spring.config.import=optional:file:./cau_hinh_rieng.properties
