<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xử lý đơn')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h3 class="text-ts mb-0"><i class="bi bi-list-check"></i> Xử lý đơn hàng</h3>
        <a th:href="@{/}" class="btn btn-ts"><i class="bi bi-plus-circle"></i> Tạo đơn tại quầy</a>
    </div>

    <div class="category-pills mb-3">
        <a th:href="@{/staff/orders}" class="btn btn-sm"
           th:classappend="${selectedStatus == null} ? 'btn-ts' : 'btn-outline-ts'">Tất cả</a>
        <a th:each="s : ${statuses}" th:href="@{/staff/orders(status=${s})}" class="btn btn-sm"
           th:classappend="${selectedStatus == s} ? 'btn-ts' : 'btn-outline-ts'" th:text="${s.label}"></a>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-light">Không có đơn nào.</div>

    <div class="card" th:unless="${#lists.isEmpty(orders)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Mã đơn</th><th>Thời gian</th><th>Khách</th><th>Hình thức</th><th>Món</th>
                    <th class="text-end">Tổng</th><th>Trạng thái</th><th>Thanh toán</th><th style="min-width:210px">Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders}" th:with="next=${o.status.next(o.orderType)}">
                    <td><a th:href="@{/orders/{id}(id=${o.id})}" class="fw-semibold text-ts" th:text="${o.orderCode}"></a></td>
                    <td class="small" th:text="${#temporals.format(o.createdAt, 'dd/MM HH:mm')}"></td>
                    <td>
                        <div th:text="${o.customerName}"></div>
                        <small class="text-muted" th:text="${o.phone}"></small>
                    </td>
                    <td class="small" th:text="${o.orderType.label}"></td>
                    <td class="small">
                        <div th:each="i : ${o.items}" th:text="${i.quantity} + ' x ' + ${i.description}"></div>
                    </td>
                    <td class="text-end price" th:text="${#numbers.formatDecimal(o.total, 1, 'POINT', 0, 'COMMA')} + 'đ'"></td>
                    <td><span class="badge" th:classappend="'bg-' + ${o.status.badge}" th:text="${o.status.label}"></span></td>
                    <td>
                        <span class="badge" th:classappend="'bg-' + ${o.paymentStatus.badge}" th:text="${o.paymentStatus.label}"></span>
                        <div class="small text-muted" th:text="${o.paymentMethod.label}"></div>
                    </td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <form th:if="${next != null}" th:action="@{/staff/orders/{id}/next(id=${o.id})}" method="post">
                                <button class="btn btn-sm btn-ts" th:text="'→ ' + ${next.label}">Tiếp</button>
                            </form>
                            <form th:if="${o.paymentStatus.name() == 'CHUA_THANH_TOAN' and o.status.name() != 'DA_HUY'}"
                                  th:action="@{/staff/orders/{id}/paid(id=${o.id})}" method="post">
                                <button class="btn btn-sm btn-outline-success" title="Xác nhận đã thanh toán"><i class="bi bi-cash-coin"></i></button>
                            </form>
                            <form th:unless="${o.status.finished}" th:action="@{/staff/orders/{id}/cancel(id=${o.id})}" method="post"
                                  onsubmit="return confirm('Huỷ đơn này?')">
                                <button class="btn btn-sm btn-outline-danger" title="Huỷ"><i class="bi bi-x-lg"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
