<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="text-ts mb-3"><i class="bi bi-tags"></i> Danh mục đồ uống</h3>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card p-3">
                <h6 th:text="${form.id == null} ? 'Thêm danh mục' : 'Sửa danh mục'">Thêm</h6>
                <form th:action="@{/admin/categories/save}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-2">
                        <label class="form-label">Tên danh mục *</label>
                        <input th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Mô tả</label>
                        <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                    </div>
                    <button class="btn btn-ts">Lưu</button>
                    <a th:if="${form.id != null}" th:href="@{/admin/categories}" class="btn btn-link">Huỷ sửa</a>
                </form>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <table class="table align-middle mb-0">
                    <thead><tr><th>#</th><th>Tên</th><th>Mô tả</th><th style="width:140px"></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td th:text="${c.id}"></td>
                        <td class="fw-semibold" th:text="${c.name}"></td>
                        <td class="small text-muted" th:text="${c.description}"></td>
                        <td class="d-flex gap-1">
                            <a th:href="@{/admin/categories(edit=${c.id})}" class="btn btn-sm btn-outline-ts"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"
                                  onsubmit="return confirm('Xoá danh mục này?')">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
