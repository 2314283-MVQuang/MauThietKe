<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-ts mb-0"><i class="bi bi-people"></i> Tài khoản &amp; phân quyền</h3>
        <a th:href="@{/admin/users/new}" class="btn btn-ts"><i class="bi bi-person-plus"></i> Thêm tài khoản</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Liên hệ</th><th>Vai trò</th><th>Trạng thái</th><th style="width:120px"></th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td class="fw-semibold" th:text="${u.username}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td class="small">
                        <div th:text="${u.phone}"></div>
                        <div class="text-muted" th:text="${u.email}"></div>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : (${u.role.name() == 'STAFF'} ? 'bg-primary' : 'bg-secondary')"
                              th:text="${u.role.label}"></span>
                    </td>
                    <td>
                        <span th:if="${u.enabled}" class="badge bg-success">Hoạt động</span>
                        <span th:unless="${u.enabled}" class="badge bg-dark">Đã khoá</span>
                    </td>
                    <td class="d-flex gap-1">
                        <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-ts" title="Sửa"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                            <button class="btn btn-sm btn-outline-secondary" th:title="${u.enabled} ? 'Khoá' : 'Mở khoá'">
                                <i class="bi" th:classappend="${u.enabled} ? 'bi-lock' : 'bi-unlock'"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
