<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đồ uống')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-ts mb-0"><i class="bi bi-cup-hot"></i> Đồ uống</h3>
        <a th:href="@{/admin/products/new}" class="btn btn-ts"><i class="bi bi-plus-lg"></i> Thêm đồ uống</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th style="width:72px">Ảnh</th><th>Tên</th><th>Danh mục</th><th class="text-end">Giá M</th><th class="text-end">Giá L</th><th>Đánh giá</th>
                    <th>Trạng thái</th><th style="width:170px"></th></tr></thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td>
                        <div th:if="${p.imageUrl}" class="photo-frame rounded-2" style="width:56px;height:56px">
                            <img th:src="${p.imageUrl}" alt="">
                        </div>
                        <div th:unless="${p.imageUrl}" class="rounded-2 d-flex align-items-center justify-content-center"
                             style="width:56px;height:56px;background:#efe3d3;font-size:26px">🧋</div>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${p.name}"></div>
                        <small class="text-muted" th:text="${p.description}"></small>
                    </td>
                    <td th:text="${p.category.name}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(p.priceM, 1, 'POINT', 0, 'COMMA')} + 'đ'"></td>
                    <td class="text-end">
                        <span th:text="${#numbers.formatDecimal(p.priceL, 1, 'POINT', 0, 'COMMA')} + 'đ'"></span>
                        <div th:each="x : ${p.extraSizes}" class="small text-muted"
                             th:text="${x.name} + ': ' + ${#numbers.formatDecimal(x.price, 1, 'POINT', 0, 'COMMA')} + 'đ'"></div>
                    </td>
                    <td><span th:replace="~{fragments/stars :: stars(${p.ratingAvg}, ${p.ratingCount})}"></span></td>
                    <td>
                        <span th:if="${p.available}" class="badge bg-success">Đang bán</span>
                        <span th:unless="${p.available}" class="badge bg-secondary">Tạm ẩn</span>
                    </td>
                    <td class="d-flex gap-1">
                        <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-ts" title="Sửa"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/admin/products/{id}/toggle(id=${p.id})}" method="post">
                            <button class="btn btn-sm btn-outline-secondary" th:title="${p.available} ? 'Tạm ẩn' : 'Mở bán'">
                                <i class="bi" th:classappend="${p.available} ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </form>
                        <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                              onsubmit="return confirm('Xoá đồ uống này?')">
                            <button class="btn btn-sm btn-outline-danger" title="Xoá"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
