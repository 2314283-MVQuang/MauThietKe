<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đánh giá')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="text-ts mb-1"><i class="bi bi-star"></i> Đánh giá của khách hàng</h3>
    <p class="text-muted small">Ẩn nhận xét không phù hợp: nhận xét bị ẩn không hiện trên web và không tính vào điểm trung bình của món.</p>

    <div th:if="${#lists.isEmpty(reviews)}" class="alert alert-light">Chưa có đánh giá nào.</div>

    <div class="card" th:unless="${#lists.isEmpty(reviews)}">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Thời gian</th><th>Món</th><th>Khách hàng</th><th>Sao</th><th>Nhận xét</th><th>Trạng thái</th><th style="width:110px"></th></tr></thead>
                <tbody>
                <tr th:each="r : ${reviews}" th:classappend="${!r.visible} ? 'table-secondary'">
                    <td class="small text-nowrap" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><a th:href="@{/products/{id}(id=${r.product.id})} + '#reviews'" class="text-ts" th:text="${r.product.name}"></a></td>
                    <td>
                        <div th:text="${r.user.fullName}"></div>
                        <small class="text-muted" th:text="${r.user.username}"></small>
                    </td>
                    <td><span th:replace="~{fragments/stars :: fixed(${r.rating})}"></span></td>
                    <td class="small" style="max-width:360px" th:text="${r.comment != null} ? ${r.comment} : '—'"></td>
                    <td>
                        <span th:if="${r.visible}" class="badge bg-success">Hiển thị</span>
                        <span th:unless="${r.visible}" class="badge bg-secondary">Đã ẩn</span>
                    </td>
                    <td class="d-flex gap-1">
                        <form th:action="@{/admin/reviews/{id}/toggle(id=${r.id})}" method="post">
                            <button class="btn btn-sm btn-outline-secondary" th:title="${r.visible} ? 'Ẩn' : 'Hiện lại'">
                                <i class="bi" th:classappend="${r.visible} ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </form>
                        <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post"
                              onsubmit="return confirm('Xoá hẳn đánh giá này?')">
                            <button class="btn btn-sm btn-outline-danger" title="Xoá"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
