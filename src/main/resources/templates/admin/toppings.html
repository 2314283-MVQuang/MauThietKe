<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Topping')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="text-ts mb-1"><i class="bi bi-circle"></i> Topping</h3>
    <p class="text-muted small">Mỗi topping khách chọn sẽ được bọc thành một <code>ToppingDecorator</code> quanh ly nước
        (Decorator Pattern) - thêm topping mới ở đây không cần sửa code.</p>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card p-3">
                <h6 th:text="${form.id == null} ? 'Thêm topping' : 'Sửa topping'">Thêm</h6>
                <form th:action="@{/admin/toppings/save}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-2">
                        <label class="form-label">Tên topping *</label>
                        <input th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Giá (đ) *</label>
                        <input th:field="*{price}" type="number" min="0" step="500" class="form-control" required>
                    </div>
                    <div class="form-check mb-2">
                        <input th:field="*{available}" type="checkbox" class="form-check-input">
                        <label class="form-check-label" th:for="${#ids.prev('available')}">Đang bán</label>
                    </div>
                    <button class="btn btn-ts">Lưu</button>
                    <a th:if="${form.id != null}" th:href="@{/admin/toppings}" class="btn btn-link">Huỷ sửa</a>
                </form>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Tên</th><th class="text-end">Giá</th><th>Trạng thái</th><th style="width:140px"></th></tr></thead>
                    <tbody>
                    <tr th:each="t : ${toppings}">
                        <td class="fw-semibold" th:text="${t.name}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(t.price, 1, 'POINT', 0, 'COMMA')} + 'đ'"></td>
                        <td>
                            <span th:if="${t.available}" class="badge bg-success">Đang bán</span>
                            <span th:unless="${t.available}" class="badge bg-secondary">Tạm hết</span>
                        </td>
                        <td class="d-flex gap-1">
                            <a th:href="@{/admin/toppings(edit=${t.id})}" class="btn btn-sm btn-outline-ts"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/toppings/{id}/delete(id=${t.id})}" method="post"
                                  onsubmit="return confirm('Xoá topping này?')">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
