<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 760px">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <a th:href="@{/admin/users}" class="text-ts text-decoration-none"><i class="bi bi-arrow-left"></i> Danh sách tài khoản</a>
    <h3 class="text-ts my-3" th:text="${form.id == null} ? 'Thêm tài khoản' : 'Sửa tài khoản ' + ${form.username}">Tài khoản</h3>

    <div class="card p-4">
        <form th:action="@{/admin/users/save}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Tên đăng nhập *</label>
                    <input th:field="*{username}" class="form-control" th:readonly="${form.id != null}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" th:text="${form.id == null} ? 'Mật khẩu *' : 'Mật khẩu mới (để trống = giữ nguyên)'">Mật khẩu</label>
                    <input th:field="*{password}" type="password" class="form-control" th:required="${form.id == null}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Họ tên *</label>
                    <input th:field="*{fullName}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Vai trò (phân quyền)</label>
                    <select th:field="*{role}" class="form-select">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input th:field="*{phone}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input th:field="*{email}" type="email" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Địa chỉ</label>
                    <input th:field="*{address}" class="form-control">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input th:field="*{enabled}" type="checkbox" class="form-check-input">
                        <label class="form-check-label" th:for="${#ids.prev('enabled')}">Cho phép đăng nhập</label>
                    </div>
                </div>
            </div>
            <button class="btn btn-ts mt-4"><i class="bi bi-save"></i> Lưu</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
